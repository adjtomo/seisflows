<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img">
<title>An array of 54 tasks without and with pack mode</title>
<desc>Two timelines. Without pack, 54 array jobs run three at a time in 18 waves and each wave waits in the queue again. With pack, three jobs wait in the queue once and each runs 18 tasks one after another. A main job resumes after all three and reads the marker files of the tasks to see which failed.</desc>
<style>
text { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
.t { font-size: 14px; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.teal .th { fill: #085041; }
.teal .ts { fill: #0F6E56; }
.coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
.coral .th { fill: #712B13; }
.coral .ts { fill: #993C1D; }
.box { fill: none; stroke: #888780; stroke-width: 0.5; stroke-dasharray: 4 3; }
.arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
.dashed { stroke-dasharray: 4 3; }
.rule { stroke: #D3D1C7; stroke-width: 0.5; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="679" height="539" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>

<!-- Without pack -->
<text class="th" x="40" y="36">Without pack (default)</text>
<text class="ts" x="640" y="36" text-anchor="end">pack: False, ntask_max: 3</text>

<text class="t" x="40" y="92" dominant-baseline="central">54 array jobs,</text>
<text class="ts" x="40" y="110" dominant-baseline="central">3 at a time</text>

<!-- wave 1 -->
<rect class="box" x="190" y="68" width="30" height="22" rx="4"/>
<rect class="box" x="190" y="96" width="30" height="22" rx="4"/>
<rect class="box" x="190" y="124" width="30" height="22" rx="4"/>
<g class="coral">
<rect x="220" y="68" width="70" height="22" rx="4"/><text class="ts" x="255" y="79" text-anchor="middle" dominant-baseline="central">task 0</text>
<rect x="220" y="96" width="70" height="22" rx="4"/><text class="ts" x="255" y="107" text-anchor="middle" dominant-baseline="central">task 1</text>
<rect x="220" y="124" width="70" height="22" rx="4"/><text class="ts" x="255" y="135" text-anchor="middle" dominant-baseline="central">task 2</text>
</g>
<!-- wave 2 -->
<rect class="box" x="310" y="68" width="30" height="22" rx="4"/>
<rect class="box" x="310" y="96" width="30" height="22" rx="4"/>
<rect class="box" x="310" y="124" width="30" height="22" rx="4"/>
<g class="coral">
<rect x="340" y="68" width="70" height="22" rx="4"/><text class="ts" x="375" y="79" text-anchor="middle" dominant-baseline="central">task 3</text>
<rect x="340" y="96" width="70" height="22" rx="4"/><text class="ts" x="375" y="107" text-anchor="middle" dominant-baseline="central">task 4</text>
<rect x="340" y="124" width="70" height="22" rx="4"/><text class="ts" x="375" y="135" text-anchor="middle" dominant-baseline="central">task 5</text>
</g>
<!-- wave 3 -->
<rect class="box" x="430" y="68" width="30" height="22" rx="4"/>
<rect class="box" x="430" y="96" width="30" height="22" rx="4"/>
<rect class="box" x="430" y="124" width="30" height="22" rx="4"/>
<g class="coral">
<rect x="460" y="68" width="70" height="22" rx="4"/><text class="ts" x="495" y="79" text-anchor="middle" dominant-baseline="central">task 6</text>
<rect x="460" y="96" width="70" height="22" rx="4"/><text class="ts" x="495" y="107" text-anchor="middle" dominant-baseline="central">task 7</text>
<rect x="460" y="124" width="70" height="22" rx="4"/><text class="ts" x="495" y="135" text-anchor="middle" dominant-baseline="central">task 8</text>
</g>
<text class="th" x="560" y="107" dominant-baseline="central">… 18 waves</text>
<text class="ts" x="190" y="170">Each wave waits in the queue again: 18 trips through the queue</text>

<line class="rule" x1="40" y1="190" x2="640" y2="190"/>

<!-- With pack -->
<text class="th" x="40" y="226">With pack</text>
<text class="ts" x="640" y="226" text-anchor="end">pack: True, njob: 3</text>

<text class="t" x="40" y="264" dominant-baseline="central">Main job</text>
<g class="teal">
<rect x="190" y="252" width="60" height="24" rx="4"/>
<text class="ts" x="220" y="264" text-anchor="middle" dominant-baseline="central">run</text>
</g>
<rect class="box" x="250" y="252" width="320" height="24" rx="4"/>
<text class="ts" x="410" y="264" text-anchor="middle" dominant-baseline="central">afterany the three jobs</text>
<g class="teal">
<rect x="570" y="252" width="70" height="24" rx="4"/>
<text class="ts" x="605" y="264" text-anchor="middle" dominant-baseline="central">resume</text>
</g>

<text class="t" x="40" y="318" dominant-baseline="central">Job 0</text>
<text class="ts" x="40" y="334" dominant-baseline="central">tasks 0 to 17</text>
<text class="t" x="40" y="358" dominant-baseline="central">Job 1</text>
<text class="ts" x="40" y="374" dominant-baseline="central">tasks 18 to 35</text>
<text class="t" x="40" y="398" dominant-baseline="central">Job 2</text>
<text class="ts" x="40" y="414" dominant-baseline="central">tasks 36 to 53</text>

<!-- job 0 -->
<rect class="box" x="190" y="308" width="30" height="24" rx="4"/>
<g class="coral">
<rect x="220" y="308" width="54" height="24" rx="4"/><text class="ts" x="247" y="320" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="274" y="308" width="54" height="24" rx="4"/><text class="ts" x="301" y="320" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="328" y="308" width="54" height="24" rx="4"/><text class="ts" x="355" y="320" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="382" y="308" width="54" height="24" rx="4"/><text class="ts" x="409" y="320" text-anchor="middle" dominant-baseline="central">…</text>
<rect x="436" y="308" width="54" height="24" rx="4"/><text class="ts" x="463" y="320" text-anchor="middle" dominant-baseline="central">16</text>
<rect x="490" y="308" width="54" height="24" rx="4"/><text class="ts" x="517" y="320" text-anchor="middle" dominant-baseline="central">17</text>
</g>
<!-- job 1 -->
<rect class="box" x="190" y="348" width="30" height="24" rx="4"/>
<g class="coral">
<rect x="220" y="348" width="54" height="24" rx="4"/><text class="ts" x="247" y="360" text-anchor="middle" dominant-baseline="central">18</text>
<rect x="274" y="348" width="54" height="24" rx="4"/><text class="ts" x="301" y="360" text-anchor="middle" dominant-baseline="central">19</text>
<rect x="328" y="348" width="54" height="24" rx="4"/><text class="ts" x="355" y="360" text-anchor="middle" dominant-baseline="central">20</text>
<rect x="382" y="348" width="54" height="24" rx="4"/><text class="ts" x="409" y="360" text-anchor="middle" dominant-baseline="central">…</text>
<rect x="436" y="348" width="54" height="24" rx="4"/><text class="ts" x="463" y="360" text-anchor="middle" dominant-baseline="central">34</text>
<rect x="490" y="348" width="54" height="24" rx="4"/><text class="ts" x="517" y="360" text-anchor="middle" dominant-baseline="central">35</text>
</g>
<!-- job 2 -->
<rect class="box" x="190" y="388" width="30" height="24" rx="4"/>
<g class="coral">
<rect x="220" y="388" width="54" height="24" rx="4"/><text class="ts" x="247" y="400" text-anchor="middle" dominant-baseline="central">36</text>
<rect x="274" y="388" width="54" height="24" rx="4"/><text class="ts" x="301" y="400" text-anchor="middle" dominant-baseline="central">37</text>
<rect x="328" y="388" width="54" height="24" rx="4"/><text class="ts" x="355" y="400" text-anchor="middle" dominant-baseline="central">38</text>
<rect x="382" y="388" width="54" height="24" rx="4"/><text class="ts" x="409" y="400" text-anchor="middle" dominant-baseline="central">…</text>
<rect x="436" y="388" width="54" height="24" rx="4"/><text class="ts" x="463" y="400" text-anchor="middle" dominant-baseline="central">52</text>
<rect x="490" y="388" width="54" height="24" rx="4"/><text class="ts" x="517" y="400" text-anchor="middle" dominant-baseline="central">53</text>
</g>

<!-- main job submits the array, one qsub/sbatch -->
<path class="arr" d="M205 278 V292 H176 V400"/>
<path class="arr" d="M176 320 H188" marker-end="url(#arrow)"/>
<path class="arr" d="M176 360 H188" marker-end="url(#arrow)"/>
<path class="arr" d="M176 400 H188" marker-end="url(#arrow)"/>

<!-- the jobs end, the scheduler releases the resume job -->
<path class="arr dashed" d="M544 320 H600 M544 360 H600 M544 400 H600 M600 400 V278" marker-end="url(#arrow)"/>

<text class="ts" x="40" y="446">One trip through the queue. Each job runs its tasks one after another, each as its own process</text>
<text class="ts" x="40" y="462">with its own log and time limit (tasktime), and leaves a marker file when it ends (N.ok or N.fail).</text>
<text class="ts" x="40" y="478">The resumed main job reads the markers: only the tasks that failed are run again.</text>

<!-- legend -->
<g class="teal"><rect x="40" y="494" width="16" height="16" rx="3"/></g>
<text class="ts" x="64" y="502" dominant-baseline="central">Main job running</text>
<g class="coral"><rect x="190" y="494" width="16" height="16" rx="3"/></g>
<text class="ts" x="214" y="502" dominant-baseline="central">A task running</text>
<rect class="box" x="340" y="494" width="16" height="16" rx="3"/>
<text class="ts" x="364" y="502" dominant-baseline="central">Waiting in the queue</text>
<line class="arr dashed" x1="510" y1="502" x2="534" y2="502" marker-end="url(#arrow)"/>
<text class="ts" x="542" y="502" dominant-baseline="central">Resume job released</text>
</svg>
